<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050810">
    <link rel="manifest" href="manifest.json">
    <title>Finanzas Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        :root { --bg: #050810; --card: rgba(13, 20, 38, 0.7); }
        body { background-color: var(--bg); color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: var(--card); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .num-pad-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 1rem; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; }
        .pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #6366f1; transition: 0.2s; }
        .pin-dot.filled { background: #6366f1; box-shadow: 0 0 15px #6366f1; }
        .editable-input { background: transparent; border: none; outline: none; color: inherit; width: 100%; }
        .status-pagado { opacity: 0.5; filter: grayscale(50%); border-left: 4px solid #6366f1 !important; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const dbPromise = idb.openDB('FinanzasProDB', 1, {
            upgrade(db) { db.createObjectStore('settings'); },
        });

        const Icon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.style.width = `${size}px`; i.style.height = `${size}px`;
                    i.className = className;
                    iconRef.current.appendChild(i);
                    lucide.createIcons({ node: iconRef.current });
                }
            }, [name]);
            return <span ref={iconRef} className="inline-flex items-center"></span>;
        };

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [view, setView] = useState('summary');
            const [pinInput, setPinInput] = useState('');
            const [data, setData] = useState({ userName: 'Martin', securityPin: null, incomes: [], expenses: [], installments: [] });

            useEffect(() => {
                async function load() {
                    const db = await dbPromise;
                    const saved = await db.get('settings', 'userData');
                    if (saved) setData(saved);
                }
                load();
            }, []);

            useEffect(() => {
                async function save() {
                    const db = await dbPromise;
                    await db.put('settings', data, 'userData');
                }
                save();
            }, [data]);

            const totals = useMemo(() => {
                const inc = data.incomes.reduce((a, b) => a + (Number(b.amount) || 0), 0);
                const expF = data.expenses.reduce((a, b) => a + (Number(b.amount) || 0), 0);
                const expC = data.installments.reduce((a, b) => a + (Number(b.monthlyFee) || 0), 0);
                return { inc, exp: expF + expC, bal: inc - (expF + expC) };
            }, [data]);

            const handlePin = (n) => {
                const newPin = pinInput + n;
                if (newPin.length <= 4) setPinInput(newPin);
                if (newPin.length === 4) {
                    if (!data.securityPin) {
                        setData({...data, securityPin: newPin});
                        setIsLocked(false);
                        setPinInput('');
                    } else if (newPin === data.securityPin) {
                        setIsLocked(false);
                        setPinInput('');
                    } else {
                        setTimeout(() => setPinInput(''), 400);
                    }
                }
            };

            const addItem = (type) => {
                const newItem = { id: Date.now(), title: 'Nuevo', amount: 0 };
                if (type === 'installments') { newItem.monthlyFee = 0; newItem.paid = 1; newItem.total = 12; newItem.status = ''; }
                setData(prev => ({ ...prev, [type]: [newItem, ...prev[type]] }));
            };

            const editItem = (type, id, field, val) => {
                const cleanVal = (field === 'amount' || field === 'monthlyFee' || field === 'paid' || field === 'total') ? Number(val) : val;
                setData(prev => ({
                    ...prev,
                    [type]: prev[type].map(item => item.id === id ? {...item, [field]: cleanVal} : item)
                }));
            };

            if (isLocked) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8">
                        <div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mb-8 shadow-lg shadow-indigo-500/20"><Icon name="lock" size={28} className="text-white"/></div>
                        <h2 className="text-lg font-black text-indigo-400 mb-10 uppercase tracking-widest">{data.securityPin ? "Ingresar PIN" : "Crear PIN"}</h2>
                        <div className="flex gap-6 mb-16">{[0,1,2,3].map(i => <div key={i} className={`pin-dot ${pinInput.length > i ? 'filled' : ''}`}></div>)}</div>
                        <div className="grid grid-cols-3 gap-4 w-full max-w-xs">
                            {[1,2,3,4,5,6,7,8,9, 'C', 0, 'del'].map(n => (
                                <button key={n} onClick={() => n === 'del' ? setPinInput(pinInput.slice(0,-1)) : n === 'C' ? setPinInput('') : handlePin(n)} className="num-pad-btn text-white">{n === 'del' ? <Icon name="delete"/> : n}</button>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24">
                    <header className="p-6 flex justify-between items-center max-w-md mx-auto">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center"><Icon name="wallet" size={16} className="text-white"/></div>
                            <input value={data.userName} onChange={e => setData({...data, userName: e.target.value})} className="editable-input font-black text-white uppercase tracking-tighter w-32" />
                        </div>
                        <button onClick={() => setIsLocked(true)} className="p-2 bg-white/5 rounded-lg text-slate-500"><Icon name="log-out" size={18}/></button>
                    </header>

                    <main className="px-6 max-w-md mx-auto space-y-8">
                        <div className="glass-card p-8 border-t-2 border-indigo-500 shadow-2xl">
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Balance Disponible</p>
                            <h2 className={`text-5xl font-black tracking-tighter ${totals.bal >= 0 ? 'text-white' : 'text-rose-500'}`}>${totals.bal.toLocaleString('es-AR')}</h2>
                        </div>

                        {/* INGRESOS */}
                        <section className="space-y-3">
                            <div className="flex justify-between items-center px-1">
                                <h3 className="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Ingresos</h3>
                                <button onClick={() => addItem('incomes')} className="bg-emerald-600 text-white px-3 py-1 rounded text-[9px] font-black">+ AGREGAR</button>
                            </div>
                            {data.incomes.map(i => (
                                <div key={i.id} className="glass-card p-4 flex justify-between items-center border-l-4 border-emerald-500">
                                    <input value={i.title} onChange={e => editItem('incomes', i.id, 'title', e.target.value)} className="editable-input font-bold text-sm" />
                                    <div className="flex items-center gap-2">
                                        <span className="text-emerald-500 font-bold">$</span>
                                        <input type="number" value={i.amount} onChange={e => editItem('incomes', i.id, 'amount', e.target.value)} className="editable-input w-24 text-right font-black text-lg" />
                                        <button onClick={() => setData({...data, incomes: data.incomes.filter(x => x.id !== i.id)})} className="text-slate-700 ml-2"><Icon name="trash-2" size={14}/></button>
                                    </div>
                                </div>
                            ))}
                        </section>

                        {/* GASTOS FIJOS */}
                        <section className="space-y-3">
                            <div className="flex justify-between items-center px-1">
                                <h3 className="text-[10px] font-black text-rose-500 uppercase tracking-widest">Gastos Fijos</h3>
                                <button onClick={() => addItem('expenses')} className="bg-rose-600 text-white px-3 py-1 rounded text-[9px] font-black">+ AGREGAR</button>
                            </div>
                            {data.expenses.map(i => (
                                <div key={i.id} className="glass-card p-4 flex justify-between items-center border-l-4 border-rose-500">
                                    <input value={i.title} onChange={e => editItem('expenses', i.id, 'title', e.target.value)} className="editable-input font-bold text-sm" />
                                    <div className="flex items-center gap-2">
                                        <span className="text-rose-500 font-bold">$</span>
                                        <input type="number" value={i.amount} onChange={e => editItem('expenses', i.id, 'amount', e.target.value)} className="editable-input w-24 text-right font-black text-lg" />
                                        <button onClick={() => setData({...data, expenses: data.expenses.filter(x => x.id !== i.id)})} className="text-slate-700 ml-2"><Icon name="trash-2" size={14}/></button>
                                    </div>
                                </div>
                            ))}
                        </section>

                        {/* CUOTAS / TARJETAS */}
                        <section className="space-y-3">
                            <div className="flex justify-between items-center px-1">
                                <h3 className="text-[10px] font-black text-amber-500 uppercase tracking-widest">Cuotas / Tarjetas</h3>
                                <button onClick={() => addItem('installments')} className="bg-amber-600 text-white px-3 py-1 rounded text-[9px] font-black">+ AGREGAR</button>
                            </div>
                            {data.installments.map(i => (
                                <div key={i.id} className={`glass-card p-4 space-y-4 border-l-4 border-amber-500 ${i.status === 'paid' ? 'status-pagado' : ''}`}>
                                    <div className="flex justify-between">
                                        <input value={i.title} onChange={e => editItem('installments', i.id, 'title', e.target.value)} className="editable-input font-black text-xs uppercase" />
                                        <button onClick={() => setData({...data, installments: data.installments.filter(x => x.id !== i.id)})} className="text-slate-700"><Icon name="trash-2" size={14}/></button>
                                    </div>
                                    <div className="flex justify-between items-end">
                                        <div>
                                            <p className="text-[8px] font-bold text-slate-500 uppercase">Mensual</p>
                                            <div className="flex items-center">
                                                <span className="text-amber-500 font-bold">$</span>
                                                <input type="number" value={i.monthlyFee} onChange={e => editItem('installments', i.id, 'monthlyFee', e.target.value)} className="editable-input w-24 font-black text-xl" />
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 bg-black/30 px-3 py-1 rounded-full">
                                            <button onClick={() => editItem('installments', i.id, 'paid', i.paid - 1)} className="text-slate-400">-</button>
                                            <span className="text-[10px] font-black text-indigo-400">{i.paid}/{i.total}</span>
                                            <button onClick={() => editItem('installments', i.id, 'paid', i.paid + 1)} className="text-slate-400">+</button>
                                        </div>
                                    </div>
                                    <button onClick={() => editItem('installments', i.id, 'status', i.status === 'paid' ? '' : 'paid')} className="w-full py-2 bg-white/5 rounded-lg text-[9px] font-black text-slate-400 uppercase">
                                        {i.status === 'paid' ? '✓ Pagado este mes' : 'Marcar como Pagado'}
                                    </button>
                                </div>
                            ))}
                        </section>
                    </main>

                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 w-64 h-14 bg-slate-900/90 backdrop-blur-xl border border-white/10 rounded-2xl flex items-center justify-around shadow-2xl">
                        <button onClick={() => setView('summary')} className={`flex flex-col items-center ${view === 'summary' ? 'text-indigo-400' : 'text-slate-500'}`}><Icon name="layout-grid"/><span className="text-[8px] font-black uppercase">Panel</span></button>
                        <button onClick={() => setView('reports')} className={`flex flex-col items-center ${view === 'reports' ? 'text-indigo-400' : 'text-slate-500'}`}><Icon name="pie-chart"/><span className="text-[8px] font-black uppercase">Stats</span></button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
        });
      }
    </script>
</body>
</html>
