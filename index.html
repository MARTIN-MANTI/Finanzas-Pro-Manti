<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050810">
    <link rel="manifest" href="manifest.json">
    <title>Finanzas Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { background-color: #050810; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
        .glass-card { background: rgba(13, 20, 38, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .editable-input { background: transparent; border: none; outline: none; color: inherit; width: 100%; }
        .balance-text { font-size: clamp(1.8rem, 8vw, 3.5rem); line-height: 1.2; word-break: break-all; }
        input[type="date"] { color-scheme: dark; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const dbPromise = idb.openDB('FinanzasProDB', 1, { upgrade(db) { db.createObjectStore('settings'); } });

        const Icon = ({ name, size = 18 }) => {
            const iconRef = useRef(null);
            useEffect(() => { if (iconRef.current) lucide.createIcons({ node: iconRef.current }); }, [name]);
            return <i ref={iconRef} data-lucide={name} style={{width: size, height: size}}></i>;
        };

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [data, setData] = useState(null);
            const [pinInput, setPinInput] = useState('');

            // Cargar datos al inicio
            useEffect(() => {
                async function init() {
                    const db = await dbPromise;
                    const saved = await db.get('settings', 'userData');
                    setData(saved || { userName: 'MARTIN', securityPin: null, incomes: [], expenses: [], installments: [] });
                }
                init();
            }, []);

            // Guardar datos cuando cambien
            useEffect(() => {
                if (data) {
                    const save = async () => {
                        const db = await dbPromise;
                        await db.put('settings', data, 'userData');
                    };
                    save();
                }
            }, [data]);

            const totals = useMemo(() => {
                if (!data) return { inc: 0, exp: 0, bal: 0 };
                const inc = data.incomes.reduce((a, b) => a + (Number(b.amount) || 0), 0);
                const expC = data.installments.reduce((a, b) => a + (Number(b.monthlyFee) || 0), 0);
                return { inc, exp: expC, bal: inc - expC };
            }, [data]);

            const getStatus = (item) => {
                if (item.isPaid) return { label: 'Pagado', color: 'text-emerald-400 bg-emerald-400/10' };
                if (!item.dueDate) return { label: 'Sin Fecha', color: 'text-slate-500' };
                const diff = Math.ceil((new Date(item.dueDate) - new Date()) / (1000 * 60 * 60 * 24));
                if (diff < 0) return { label: 'Vencido', color: 'text-rose-500 bg-rose-500/10' };
                if (diff <= 5) return { label: 'Pendiente', color: 'text-amber-500 bg-amber-500/10' };
                return { label: 'Vigente', color: 'text-indigo-400 bg-indigo-400/10' };
            };

            const handlePin = (n) => {
                const newPin = pinInput + n;
                if (newPin.length <= 4) setPinInput(newPin);
                if (newPin.length === 4) {
                    if (!data.securityPin) {
                        setData({...data, securityPin: newPin});
                        setIsLocked(false);
                    } else if (newPin === data.securityPin) {
                        setIsLocked(false);
                    } else {
                        setPinInput('');
                    }
                }
            };

            if (!data) return <div className="min-h-screen bg-[#050810]"></div>;

            if (isLocked) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 bg-[#050810]">
                        <div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mb-8 shadow-xl shadow-indigo-500/20"><Icon name="shield" size={30}/></div>
                        <h2 className="text-xs font-black text-indigo-400 mb-10 uppercase tracking-[0.3em]">{data.securityPin ? "Ingresar PIN" : "Crear PIN"}</h2>
                        <div className="flex gap-4 mb-16">{[0,1,2,3].map(i => <div key={i} className={`w-4 h-4 rounded-full border-2 border-indigo-500 ${pinInput.length > i ? 'bg-indigo-500' : ''}`}></div>)}</div>
                        <div className="grid grid-cols-3 gap-6 w-full max-w-xs">
                            {[1,2,3,4,5,6,7,8,9, 'C', 0, 'del'].map(n => (
                                <button key={n} onClick={() => n === 'del' ? setPinInput(pinInput.slice(0,-1)) : n === 'C' ? setPinInput('') : handlePin(n)} className="h-16 flex items-center justify-center bg-white/5 rounded-2xl text-xl font-bold active:bg-indigo-500/20 transition-all">{n === 'del' ? <Icon name="delete"/> : n}</button>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-6 max-w-md mx-auto space-y-6 pb-20">
                    <div className="flex justify-between items-center">
                        <input value={data.userName} onChange={e => setData({...data, userName: e.target.value.toUpperCase()})} className="editable-input font-black text-xl w-40" />
                        <button onClick={() => setIsLocked(true)} className="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center text-slate-500"><Icon name="lock" size={18}/></button>
                    </div>

                    <div className="glass-card p-8 border-t-2 border-indigo-500 shadow-2xl">
                        <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Balance Neto</p>
                        <h2 className="balance-text font-black tracking-tighter text-white">
                            ${totals.bal.toLocaleString('es-AR')}
                        </h2>
                    </div>

                    <section className="space-y-4">
                        <div className="flex justify-between items-center">
                            <h3 className="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Ingresos</h3>
                            <button onClick={() => setData({...data, incomes: [{id:Date.now(), title:'Nuevo', amount:''}, ...data.incomes]})} className="bg-emerald-500/20 text-emerald-500 px-3 py-1 rounded-lg text-[10px] font-black">+ AÑADIR</button>
                        </div>
                        {data.incomes.map(i => (
                            <div key={i.id} className="glass-card p-4 flex justify-between items-center border-l-4 border-emerald-500">
                                <input value={i.title} onChange={e => setData({...data, incomes: data.incomes.map(x => x.id === i.id ? {...x, title: e.target.value} : x)})} className="editable-input font-bold" placeholder="Nombre" />
                                <div className="flex items-center gap-2">
                                    <span className="text-emerald-500 font-bold">$</span>
                                    <input type="number" inputMode="numeric" value={i.amount} onChange={e => setData({...data, incomes: data.incomes.map(x => x.id === i.id ? {...x, amount: e.target.value} : x)})} className="editable-input text-right w-28 font-black text-lg" placeholder="0" />
                                </div>
                            </div>
                        ))}
                    </section>

                    <section className="space-y-4">
                        <div className="flex justify-between items-center">
                            <h3 className="text-[10px] font-black text-amber-500 uppercase tracking-widest">Cuotas / Tarjetas</h3>
                            <button onClick={() => setData({...data, installments: [{id:Date.now(), title:'Gasto', monthlyFee:'', paid:1, total:1, dueDate:'', isPaid:false}, ...data.installments]})} className="bg-amber-500/20 text-amber-500 px-3 py-1 rounded-lg text-[10px] font-black">+ AÑADIR</button>
                        </div>
                        {data.installments.map(i => {
                            const status = getStatus(i);
                            return (
                                <div key={i.id} className={`glass-card p-5 border-l-4 border-amber-500 space-y-4 ${i.isPaid ? 'opacity-40' : ''}`}>
                                    <div className="flex justify-between items-start">
                                        <div className="space-y-1">
                                            <input value={i.title} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, title: e.target.value} : x)})} className="editable-input font-black uppercase text-xs tracking-tighter" />
                                            <span className={`px-2 py-0.5 rounded text-[8px] font-black uppercase ${status.color}`}>{status.label}</span>
                                        </div>
                                        <button onClick={() => setData({...data, installments: data.installments.filter(x => x.id !== i.id)})} className="text-slate-700"><Icon name="trash-2" size={14}/></button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <p className="text-[8px] font-bold text-slate-500 uppercase mb-1">Monto Cuota</p>
                                            <div className="flex items-center text-amber-500 font-black text-xl">
                                                <span>$</span>
                                                <input type="number" inputMode="numeric" value={i.monthlyFee} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, monthlyFee: e.target.value} : x)})} className="editable-input ml-1" placeholder="0" />
                                            </div>
                                        </div>
                                        <div>
                                            <p className="text-[8px] font-bold text-slate-500 uppercase mb-1">Vencimiento</p>
                                            <input type="date" value={i.dueDate} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, dueDate: e.target.value} : x)})} className="editable-input font-bold text-xs" />
                                        </div>
                                    </div>
                                    <div className="flex justify-between items-center pt-4 border-t border-white/5">
                                        <div className="flex items-center gap-2 bg-black/40 px-3 py-1.5 rounded-xl font-black text-[10px]">
                                            <input type="number" value={i.paid} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, paid: e.target.value} : x)})} className="w-5 bg-transparent text-center text-indigo-400" />
                                            <span className="text-slate-600">/</span>
                                            <input type="number" value={i.total} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, total: e.target.value} : x)})} className="w-5 bg-transparent text-center text-slate-400" />
                                        </div>
                                        <button onClick={() => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, isPaid: !x.isPaid} : x)})} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${i.isPaid ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20' : 'bg-white/10 text-slate-400'}`}>
                                            {i.isPaid ? '✓ PAGADO' : 'MARCAR PAGO'}
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </section>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
