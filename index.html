<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050810">
    <link rel="manifest" href="manifest.json">
    <title>Finanzas Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { background-color: #050810; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overscroll-behavior-y: contain; }
        .glass-card { background: rgba(13, 20, 38, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .editable-input { background: transparent; border: none; outline: none; color: inherit; width: 100%; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }
        .balance-text { font-size: clamp(1.5rem, 10vw, 3rem); line-height: 1; transition: font-size 0.2s ease; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const dbPromise = idb.openDB('FinanzasProDB', 1, { upgrade(db) { db.createObjectStore('settings'); } });

        const Icon = ({ name, size = 18 }) => {
            const iconRef = useRef(null);
            useEffect(() => { if (iconRef.current) { lucide.createIcons({ node: iconRef.current }); } }, [name]);
            return <i ref={iconRef} data-lucide={name} style={{width: size, height: size}}></i>;
        };

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [data, setData] = useState({ userName: 'MARTIN', securityPin: null, incomes: [], expenses: [], installments: [] });
            const [pinInput, setPinInput] = useState('');

            useEffect(() => {
                async function load() {
                    const db = await dbPromise;
                    const saved = await db.get('settings', 'userData');
                    if (saved) setData(saved);
                }
                load();
            }, []);

            useEffect(() => {
                async function save() {
                    const db = await dbPromise;
                    await db.put('settings', data, 'userData');
                }
                save();
            }, [data]);

            const formatMoney = (val) => {
                const num = String(val).replace(/\D/g, "");
                return num ? parseInt(num).toLocaleString('es-AR') : "";
            };

            const parseMoney = (str) => Number(String(str).replace(/\./g, ""));

            const totals = useMemo(() => {
                const inc = data.incomes.reduce((a, b) => a + parseMoney(b.amount), 0);
                const expF = data.expenses.reduce((a, b) => a + parseMoney(b.amount), 0);
                const expC = data.installments.reduce((a, b) => a + parseMoney(b.monthlyFee), 0);
                return { inc, exp: expF + expC, bal: inc - (expF + expC) };
            }, [data]);

            const getStatus = (item) => {
                if (item.isPaid) return { label: 'Pagado', color: 'text-emerald-500 bg-emerald-500/10' };
                if (!item.dueDate) return { label: 'Sin Fecha', color: 'text-slate-500 bg-slate-500/10' };
                
                const diff = Math.ceil((new Date(item.dueDate) - new Date()) / (1000 * 60 * 60 * 24));
                if (diff < 0) return { label: 'Vencido', color: 'text-rose-500 bg-rose-500/10' };
                if (diff <= 5) return { label: 'Pendiente', color: 'text-amber-500 bg-amber-500/10' };
                return { label: 'Vigente', color: 'text-indigo-500 bg-indigo-500/10' };
            };

            const handlePin = (n) => {
                const newPin = pinInput + n;
                if (newPin.length <= 4) setPinInput(newPin);
                if (newPin.length === 4) {
                    if (!data.securityPin) { setData({...data, securityPin: newPin}); setIsLocked(false); setPinInput(''); }
                    else if (newPin === data.securityPin) { setIsLocked(false); setPinInput(''); }
                    else { setTimeout(() => setPinInput(''), 400); }
                }
            };

            if (isLocked) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8">
                        <div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mb-10"><Icon name="lock" size={30}/></div>
                        <div className="flex gap-4 mb-16">{[0,1,2,3].map(i => <div key={i} className={`w-4 h-4 rounded-full border-2 border-indigo-500 ${pinInput.length > i ? 'bg-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.8)]' : ''}`}></div>)}</div>
                        <div className="grid grid-cols-3 gap-6 w-full max-w-xs text-2xl font-black">
                            {[1,2,3,4,5,6,7,8,9,'C',0,'del'].map(n => (
                                <button key={n} onClick={() => n === 'del' ? setPinInput(pinInput.slice(0,-1)) : n === 'C' ? setPinInput('') : handlePin(n)} className="h-16 flex items-center justify-center bg-white/5 rounded-xl">{n === 'del' ? <Icon name="delete"/> : n}</button>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-6 max-w-md mx-auto space-y-6 pb-20">
                    <div className="flex justify-between items-center">
                        <input value={data.userName} onChange={e => setData({...data, userName: e.target.value.toUpperCase()})} className="editable-input font-black text-xl w-40" />
                        <button onClick={() => setIsLocked(true)} className="p-2 bg-white/5 rounded-lg"><Icon name="log-out" size={18}/></button>
                    </div>

                    <div className="glass-card p-6 border-t-2 border-indigo-500">
                        <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Balance Disponible</p>
                        <h2 className="balance-text font-black tracking-tighter text-white">
                            ${totals.bal.toLocaleString('es-AR')}
                        </h2>
                    </div>

                    <section className="space-y-4">
                        <div className="flex justify-between items-end"><h3 className="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Ingresos</h3><button onClick={() => setData({...data, incomes: [{id:Date.now(), title:'Nuevo', amount:''}, ...data.incomes]})} className="text-[10px] font-bold bg-emerald-500/20 px-3 py-1 rounded-md text-emerald-500">+ AÑADIR</button></div>
                        {data.incomes.map(i => (
                            <div key={i.id} className="glass-card p-4 flex justify-between border-l-4 border-emerald-500">
                                <input value={i.title} onChange={e => setData({...data, incomes: data.incomes.map(x => x.id === i.id ? {...x, title: e.target.value} : x)})} className="editable-input font-bold" />
                                <div className="flex items-center gap-2 font-black text-emerald-500">
                                    <span>$</span>
                                    <input inputMode="numeric" value={formatMoney(i.amount)} onChange={e => setData({...data, incomes: data.incomes.map(x => x.id === i.id ? {...x, amount: e.target.value} : x)})} className="editable-input text-right w-28 text-lg" />
                                </div>
                            </div>
                        ))}
                    </section>

                    <section className="space-y-4">
                        <div className="flex justify-between items-end"><h3 className="text-[10px] font-black text-amber-500 uppercase tracking-widest">Cuotas y Tarjetas</h3><button onClick={() => setData({...data, installments: [{id:Date.now(), title:'Nueva', monthlyFee:'', paid:1, total:1, dueDate:'', isPaid:false}, ...data.installments]})} className="text-[10px] font-bold bg-amber-500/20 px-3 py-1 rounded-md text-amber-500">+ AÑADIR</button></div>
                        {data.installments.map(i => {
                            const status = getStatus(i);
                            return (
                                <div key={i.id} className={`glass-card p-5 border-l-4 border-amber-500 space-y-4 ${i.isPaid ? 'opacity-50' : ''}`}>
                                    <div className="flex justify-between items-start">
                                        <div className="space-y-1">
                                            <input value={i.title} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, title: e.target.value} : x)})} className="editable-input font-black uppercase text-xs" />
                                            <span className={`px-2 py-0.5 rounded text-[8px] font-black uppercase ${status.color}`}>{status.label}</span>
                                        </div>
                                        <button onClick={() => setData({...data, installments: data.installments.filter(x => x.id !== i.id)})} className="text-white/20"><Icon name="trash-2" size={14}/></button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 items-center">
                                        <div>
                                            <p className="text-[8px] font-bold text-slate-500 uppercase">Mensualidad</p>
                                            <div className="flex text-amber-500 font-black"><span>$</span><input inputMode="numeric" value={formatMoney(i.monthlyFee)} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, monthlyFee: e.target.value} : x)})} className="editable-input text-lg ml-1" /></div>
                                        </div>
                                        <div>
                                            <p className="text-[8px] font-bold text-slate-500 uppercase">Vencimiento</p>
                                            <input type="date" value={i.dueDate} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, dueDate: e.target.value} : x)})} className="editable-input text-xs font-bold" />
                                        </div>
                                    </div>
                                    <div className="flex justify-between items-center pt-2 border-t border-white/5">
                                        <div className="flex items-center gap-2 bg-black/30 px-3 py-1 rounded-full text-[10px] font-black">
                                            <input inputMode="numeric" value={i.paid} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, paid: Number(e.target.value)} : x)})} className="w-6 bg-transparent text-center text-indigo-400 outline-none" />
                                            <span className="text-white/20">/</span>
                                            <input inputMode="numeric" value={i.total} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, total: Number(e.target.value)} : x)})} className="w-6 bg-transparent text-center text-slate-400 outline-none" />
                                        </div>
                                        <button onClick={() => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, isPaid: !x.isPaid} : x)})} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${i.isPaid ? 'bg-emerald-500 text-white' : 'bg-white/5 text-slate-400'}`}>
                                            {i.isPaid ? '✓ PAGADO' : 'MARCAR PAGO'}
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </section>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
