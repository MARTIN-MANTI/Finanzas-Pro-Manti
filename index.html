<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
    <style>
        body { background: #050810; color: #fff; font-family: sans-serif; margin: 0; }
        .card { background: rgba(255,255,255,0.05); border-radius: 1rem; padding: 1.5rem; border: 1px solid rgba(255,255,255,0.1); }
        input { background: transparent; border: none; color: white; outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const dbP = idb.openDB('FinanzasProDB', 1, { upgrade(db) { db.createObjectStore('s'); } });

        const App = () => {
            const [data, setData] = useState(null);
            const [pin, setPin] = useState('');
            const [isLocked, setIsLocked] = useState(true);

            useEffect(() => {
                async function load() {
                    const db = await dbP;
                    let saved = await db.get('s', 'u');
                    // RESET DE EMERGENCIA: Si los datos fallan, crear nuevos
                    if (!saved || !saved.incomes) {
                        saved = { name: 'MARTIN', pin: null, incomes: [], expenses: [] };
                    }
                    setData(saved);
                }
                load();
            }, []);

            useEffect(() => {
                if (data) dbP.then(db => db.put('s', data, 'u'));
            }, [data]);

            const handlePin = (n) => {
                const newPin = pin + n;
                if (newPin.length <= 4) setPin(newPin);
                if (newPin.length === 4) {
                    if (!data.pin) { setData({...data, pin: newPin}); setIsLocked(false); }
                    else if (newPin === data.pin) { setIsLocked(false); }
                    else { setPin(''); }
                }
            };

            if (!data) return null;

            if (isLocked) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-10">
                    <div className="text-indigo-500 mb-10"><i data-lucide="lock" style={{width:48, height:48}}></i></div>
                    <div className="flex gap-4 mb-10">
                        {[0,1,2,3].map(i => <div key={i} className={`w-3 h-3 rounded-full ${pin.length > i ? 'bg-indigo-500' : 'border border-indigo-500'}`}></div>)}
                    </div>
                    <div className="grid grid-cols-3 gap-6">
                        {[1,2,3,4,5,6,7,8,9,'C',0,'del'].map(n => (
                            <button key={n} onClick={() => n==='del'?setPin(pin.slice(0,-1)):n==='C'?setPin(''):handlePin(n)} className="w-16 h-16 bg-white/5 rounded-full text-xl">{n}</button>
                        ))}
                    </div>
                </div>
            );

            const balance = data.incomes.reduce((a,b) => a + (Number(b.m) || 0), 0);

            return (
                <div className="p-6 space-y-6">
                    <div className="flex justify-between items-center text-xs font-bold text-slate-500">
                        <input value={data.name} onChange={e => setData({...data, name: e.target.value.toUpperCase()})} />
                        <button onClick={() => setIsLocked(true)}>BLOQUEAR</button>
                    </div>
                    <div className="card border-t-4 border-indigo-500">
                        <p className="text-[10px] text-slate-400 mb-2">BALANCE</p>
                        <h2 className="text-4xl font-bold">${balance.toLocaleString()}</h2>
                    </div>
                    <div className="space-y-4">
                        <div className="flex justify-between items-center">
                            <h3 className="text-xs font-bold text-emerald-500">INGRESOS</h3>
                            <button onClick={() => setData({...data, incomes: [{id:Date.now(), t:'Nuevo', m:''}, ...data.incomes]})} className="text-[10px] bg-emerald-500/20 p-2 rounded">+</button>
                        </div>
                        {data.incomes.map(i => (
                            <div key={i.id} className="card flex justify-between py-3">
                                <input value={i.t} onChange={e => setData({...data, incomes: data.incomes.map(x => x.id === i.id ? {...x, t: e.target.value} : x)})} className="text-sm w-1/2" />
                                <input type="number" inputMode="numeric" value={i.m} onChange={e => setData({...data, incomes: data.incomes.map(x => x.id === i.id ? {...x, m: e.target.value} : x)})} className="text-right w-1/3 font-bold" placeholder="0" />
                            </div>
                        ))}
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
