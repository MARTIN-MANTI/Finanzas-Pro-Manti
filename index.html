<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050810">
    <link rel="manifest" href="manifest.json">
    <title>Finanzas Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        :root { --bg: #050810; --card: rgba(13, 20, 38, 0.7); }
        body { background-color: var(--bg); color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: var(--card); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .num-pad-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 1rem; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; }
        .status-pill { padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: 900; text-transform: uppercase; }
        .editable-input { background: transparent; border: none; outline: none; color: inherit; width: 100%; }
        ::-webkit-scrollbar { display: none; }
        .accordion-content { transition: max-height 0.3s ease-out; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const dbPromise = idb.openDB('FinanzasProDB', 1, {
            upgrade(db) { db.createObjectStore('settings'); },
        });

        const Icon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.style.width = `${size}px`; i.style.height = `${size}px`;
                    i.className = className;
                    iconRef.current.appendChild(i);
                    lucide.createIcons({ node: iconRef.current });
                }
            }, [name]);
            return <span ref={iconRef} className="inline-flex items-center"></span>;
        };

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [view, setView] = useState('summary');
            const [pinInput, setPinInput] = useState('');
            const [openSections, setOpenSections] = useState({ inc: true, exp: true, cuo: true });
            const [data, setData] = useState({ 
                userName: 'MARTIN', 
                securityPin: null, 
                incomes: [], 
                expenses: [], 
                installments: [] 
            });

            useEffect(() => {
                async function load() {
                    const db = await dbPromise;
                    const saved = await db.get('settings', 'userData');
                    if (saved) setData(saved);
                }
                load();
            }, []);

            useEffect(() => {
                async function save() {
                    const db = await dbPromise;
                    await db.put('settings', data, 'userData');
                }
                save();
            }, [data]);

            const totals = useMemo(() => {
                const inc = data.incomes.reduce((a, b) => a + (Number(b.amount) || 0), 0);
                const expF = data.expenses.reduce((a, b) => a + (Number(b.amount) || 0), 0);
                const expC = data.installments.reduce((a, b) => a + (Number(b.monthlyFee) || 0), 0);
                return { inc, exp: expF + expC, bal: inc - (expF + expC) };
            }, [data]);

            const handlePin = (n) => {
                const newPin = pinInput + n;
                if (newPin.length <= 4) setPinInput(newPin);
                if (newPin.length === 4) {
                    if (!data.securityPin) {
                        setData({...data, securityPin: newPin});
                        setIsLocked(false); setPinInput('');
                    } else if (newPin === data.securityPin) {
                        setIsLocked(false); setPinInput('');
                    } else {
                        setTimeout(() => setPinInput(''), 400);
                    }
                }
            };

            const addItem = (type) => {
                const newItem = { id: Date.now(), title: 'Nuevo', amount: 0 };
                if (type === 'installments') { 
                    newItem.monthlyFee = 0; newItem.paid = 1; newItem.total = 12; 
                    newItem.dueDay = new Date().getDate(); newItem.isPaidMonth = false;
                }
                setData(prev => ({ ...prev, [type]: [newItem, ...prev[type]] }));
            };

            const getStatus = (item) => {
                if (item.isPaidMonth) return { label: 'Pagado', color: 'bg-emerald-500/20 text-emerald-500' };
                const today = new Date().getDate();
                if (today > item.dueDay) return { label: 'Vencido', color: 'bg-rose-500/20 text-rose-500' };
                if (item.dueDay - today <= 3) return { label: 'Pendiente', color: 'bg-amber-500/20 text-amber-500' };
                return { label: 'Vigente', color: 'bg-indigo-500/20 text-indigo-500' };
            };

            const ChartView = () => {
                const canvasRef = useRef(null);
                useEffect(() => {
                    const ctx = canvasRef.current.getContext('2d');
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Ingresos', 'Gastos'],
                            datasets: [{
                                data: [totals.inc, totals.exp],
                                backgroundColor: ['#10b981', '#f43f5e'],
                                borderWidth: 0,
                                cutout: '80%'
                            }]
                        },
                        options: { plugins: { legend: { display: false } } }
                    });
                }, []);
                return (
                    <div className="space-y-8 animate-in fade-in duration-500">
                        <div className="glass-card p-8 flex flex-col items-center">
                            <div className="relative w-48 h-48">
                                <canvas ref={canvasRef}></canvas>
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                                    <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Gasto Total</span>
                                    <span className="text-xl font-black">${totals.exp.toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            if (isLocked) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 bg-[#050810]">
                        <div className="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mb-8 shadow-2xl shadow-indigo-500/40"><Icon name="shield-check" size={40} className="text-white"/></div>
                        <h2 className="text-sm font-black text-indigo-400 mb-10 uppercase tracking-[0.3em]">{data.securityPin ? "Acceso Seguro" : "Configurar PIN"}</h2>
                        <div className="flex gap-4 mb-16">{[0,1,2,3].map(i => <div key={i} className={`pin-dot ${pinInput.length > i ? 'filled' : ''}`}></div>)}</div>
                        <div className="grid grid-cols-3 gap-5 w-full max-w-xs">
                            {[1,2,3,4,5,6,7,8,9, 'C', 0, 'del'].map(n => (
                                <button key={n} onClick={() => n === 'del' ? setPinInput(pinInput.slice(0,-1)) : n === 'C' ? setPinInput('') : handlePin(n)} className="num-pad-btn text-white active:scale-90 transition-transform">
                                    {n === 'del' ? <Icon name="delete"/> : n}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-32">
                    <header className="p-6 flex justify-between items-center max-w-md mx-auto">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg"><Icon name="wallet" size={20} className="text-white"/></div>
                            <input value={data.userName} onChange={e => setData({...data, userName: e.target.value.toUpperCase()})} className="editable-input font-black text-white text-xl tracking-tighter w-40" />
                        </div>
                        <button onClick={() => setIsLocked(true)} className="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center text-slate-500"><Icon name="lock" size={18}/></button>
                    </header>

                    <main className="px-6 max-w-md mx-auto space-y-6">
                        {view === 'summary' ? (
                            <>
                                <div className="glass-card p-8 border-t-2 border-indigo-500 shadow-2xl relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="trending-up" size={80}/></div>
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-2">Balance Neto</p>
                                    <h2 className="text-5xl font-black tracking-tighter text-white break-all">
                                        ${totals.bal.toLocaleString('es-AR')}
                                    </h2>
                                </div>

                                {/* SECCIÓN INGRESOS */}
                                <section className="space-y-3">
                                    <button onClick={() => setOpenSections({...openSections, inc: !openSections.inc})} className="w-full flex justify-between items-center px-2">
                                        <h3 className="text-[10px] font-black text-emerald-500 uppercase tracking-widest flex items-center gap-2">
                                            <Icon name={openSections.inc ? "chevron-down" : "chevron-right"} size={14}/> Ingresos
                                        </h3>
                                        <span className="text-[10px] font-bold text-emerald-500/50">${totals.inc.toLocaleString()}</span>
                                    </button>
                                    {openSections.inc && (
                                        <div className="space-y-3 animate-in slide-in-from-top-2 duration-300">
                                            <button onClick={() => addItem('incomes')} className="w-full py-3 border-2 border-dashed border-emerald-500/20 rounded-2xl text-[10px] font-black text-emerald-500/40 uppercase hover:bg-emerald-500/5 transition-colors">+ Nuevo Ingreso</button>
                                            {data.incomes.map(i => (
                                                <div key={i.id} className="glass-card p-4 flex justify-between items-center border-l-4 border-emerald-500">
                                                    <input value={i.title} onChange={e => setData({...data, incomes: data.incomes.map(x => x.id === i.id ? {...x, title: e.target.value} : x)})} className="editable-input font-bold text-sm" />
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-emerald-500 font-black">$</span>
                                                        <input type="number" value={i.amount} onChange={e => setData({...data, incomes: data.incomes.map(x => x.id === i.id ? {...x, amount: e.target.value} : x)})} className="editable-input w-24 text-right font-black text-lg" />
                                                        <button onClick={() => setData({...data, incomes: data.incomes.filter(x => x.id !== i.id)})} className="text-slate-800 ml-2"><Icon name="trash" size={14}/></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </section>

                                {/* SECCIÓN CUOTAS */}
                                <section className="space-y-3">
                                    <button onClick={() => setOpenSections({...openSections, cuo: !openSections.cuo})} className="w-full flex justify-between items-center px-2">
                                        <h3 className="text-[10px] font-black text-amber-500 uppercase tracking-widest flex items-center gap-2">
                                            <Icon name={openSections.cuo ? "chevron-down" : "chevron-right"} size={14}/> Cuotas y Tarjetas
                                        </h3>
                                    </button>
                                    {openSections.cuo && (
                                        <div className="space-y-3">
                                            <button onClick={() => addItem('installments')} className="w-full py-3 border-2 border-dashed border-amber-500/20 rounded-2xl text-[10px] font-black text-amber-500/40 uppercase">+ Nueva Tarjeta/Cuota</button>
                                            {data.installments.map(i => {
                                                const status = getStatus(i);
                                                return (
                                                    <div key={i.id} className="glass-card p-5 space-y-4 border-l-4 border-amber-500">
                                                        <div className="flex justify-between items-start">
                                                            <div className="space-y-1">
                                                                <input value={i.title} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, title: e.target.value} : x)})} className="editable-input font-black text-xs uppercase tracking-tighter" />
                                                                <span className={`status-pill ${status.color}`}>{status.label}</span>
                                                            </div>
                                                            <button onClick={() => setData({...data, installments: data.installments.filter(x => x.id !== i.id)})} className="text-slate-800"><Icon name="x" size={16}/></button>
                                                        </div>
                                                        
                                                        <div className="grid grid-cols-2 gap-4">
                                                            <div>
                                                                <p className="text-[8px] font-black text-slate-500 uppercase mb-1">Cuota Mensual</p>
                                                                <div className="flex items-center text-amber-500 font-black">
                                                                    <span>$</span>
                                                                    <input type="number" value={i.monthlyFee} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, monthlyFee: e.target.value} : x)})} className="editable-input text-lg ml-1" />
                                                                </div>
                                                            </div>
                                                            <div className="text-right">
                                                                <p className="text-[8px] font-black text-slate-500 uppercase mb-1">Vence Día</p>
                                                                <input type="number" value={i.dueDay} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, dueDay: Number(e.target.value)} : x)})} className="editable-input text-right font-black text-lg" />
                                                            </div>
                                                        </div>

                                                        <div className="flex justify-between items-center pt-2 border-t border-white/5">
                                                            <div className="flex items-center gap-2 bg-black/40 px-3 py-1.5 rounded-xl">
                                                                <input type="number" value={i.paid} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, paid: e.target.value} : x)})} className="editable-input w-6 text-center text-[10px] font-black text-indigo-400" />
                                                                <span className="text-slate-600 text-[10px]">/</span>
                                                                <input type="number" value={i.total} onChange={e => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, total: e.target.value} : x)})} className="editable-input w-6 text-center text-[10px] font-black text-slate-400" />
                                                            </div>
                                                            <button 
                                                                onClick={() => setData({...data, installments: data.installments.map(x => x.id === i.id ? {...x, isPaidMonth: !x.isPaidMonth} : x)})}
                                                                className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${i.isPaidMonth ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/20' : 'bg-white/5 text-slate-400'}`}
                                                            >
                                                                {i.isPaidMonth ? '✓ Pagado' : 'Marcar Pago'}
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </section>
                            </>
                        ) : (
                            <ChartView />
                        )}
                    </main>

                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-72 h-16 bg-slate-900/80 backdrop-blur-2xl border border-white/10 rounded-3xl flex items-center justify-around shadow-2xl z-50">
                        <button onClick={() => setView('summary')} className={`flex flex-col items-center gap-1 transition-all ${view === 'summary' ? 'text-indigo-400 scale-110' : 'text-slate-600'}`}>
                            <Icon name="layout-grid" size={20}/><span className="text-[7px] font-black uppercase tracking-widest">Panel</span>
                        </button>
                        <div className="w-[1px] h-6 bg-white/5"></div>
                        <button onClick={() => setView('reports')} className={`flex flex-col items-center gap-1 transition-all ${view === 'reports' ? 'text-indigo-400 scale-110' : 'text-slate-600'}`}>
                            <Icon name="pie-chart" size={20}/><span className="text-[7px] font-black uppercase tracking-widest">Stats</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
